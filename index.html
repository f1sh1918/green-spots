<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/green-spots/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entdecke und teile versteckte Naturplätze zum Biwakieren, Schwimmen und Entspannen.">
  <meta name="keywords" content="Naturplätze, Biwakieren, Zelten, Schwimmen, Green Spots, Outdoor">

  <!-- Open Graph (WhatsApp, Facebook, Telegram) -->
  <meta property="og:title" content="Green Spots – Naturplätze entdecken">
  <meta property="og:description" content="Entdecke und teile Naturplätze zum Biwakieren, Schwimmen und Entspannen.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://f1sh1918.github.io/green-spots/">
  <meta property="og:image" content="https://f1sh1918.github.io/green-spots/icons/Icon-512.png">
  <meta property="og:locale" content="de_DE">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Green Spots – Naturplätze entdecken">
  <meta name="twitter:description" content="Entdecke und teile versteckte Naturplätze zum Biwakieren, Schwimmen und Entspannen.">
  <meta name="twitter:image" content="https://f1sh1918.github.io/green-spots/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Green Spots">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Green Spots – Naturplätze entdecken</title>
  <link rel="manifest" href="manifest.json">

  <link href="https://unpkg.com/maplibre-gl@^3/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@^3/dist/maplibre-gl.js"></script>

  <style>
    .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib {
      position: fixed;
      bottom: auto;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      right: auto;
      font-size: 10px;
      opacity: 0.7;
    }

    /* Hide built-in MapLibre zoom/compass — the app has its own */
    .maplibregl-ctrl-zoom-in,
    .maplibregl-ctrl-zoom-out,
    .maplibregl-ctrl-geolocate,
    .maplibregl-ctrl-compass {
      display: none !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
